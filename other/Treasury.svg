<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
        <!-- Subtle warm corporate gradient (Apple/McKinsey aesthetic) -->
        <linearGradient id="icon-grad-default" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4A4E59" />
            <stop offset="100%" stop-color="#2A2D34" />
        </linearGradient>

        <!-- Rupee Mask Cutout - Ensures the ₹ is truly transparent -->
        <mask id="rupee-cutout">
            <rect width="100" height="100" fill="white" />
            <text x="50" y="27" text-anchor="middle" fill="black" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="19px">₹</text>
        </mask>
    </defs>
    
    <g fill="url(#icon-grad-default)">
        <!-- Roof and Base combined in mask -->
        <g mask="url(#rupee-cutout)">
            <!-- Roof Path: perfectly rounded points -->
            <path d="M 50 6 L 12 33 L 88 33 Z" stroke="url(#icon-grad-default)" stroke-width="4" stroke-linejoin="round" />
            <!-- Roof Base -->
            <rect x="8" y="34" width="84" height="7" rx="2" />
        </g>
        
        <!-- Left Pillar -->
        <rect x="16" y="43" width="16" height="4" rx="1.5" />
        <rect x="20" y="47" width="8" height="25" rx="1" />
        <rect x="16" y="72" width="16" height="4" rx="1.5" />
        
        <!-- Middle Pillar -->
        <rect x="42" y="43" width="16" height="4" rx="1.5" />
        <rect x="46" y="47" width="8" height="25" rx="1" />
        <rect x="42" y="72" width="16" height="4" rx="1.5" />
        
        <!-- Right Pillar -->
        <rect x="68" y="43" width="16" height="4" rx="1.5" />
        <rect x="72" y="47" width="8" height="25" rx="1" />
        <rect x="68" y="72" width="16" height="4" rx="1.5" />
        
        <!-- Base Steps -->
        <rect x="10" y="78" width="80" height="6" rx="2" />
        <rect x="4" y="86" width="92" height="8" rx="2.5" />
    </g>
</svg>