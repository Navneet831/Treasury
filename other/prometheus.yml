global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Treasury Backend API (FastAPI + prometheus-fastapi-instrumentator)
  - job_name: 'treasury-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8002']
        labels:
          service: 'treasury-backend'
          tier: 'api'

  # Redis (exposed via redis_exporter or native)
  - job_name: 'treasury-redis'
    static_configs:
      - targets: ['host.docker.internal:6379']
        labels:
          service: 'treasury-redis'
          tier: 'cache'

  # Docker / Host metrics (optional)
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
        labels:
          service: 'docker'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Alert rules for common Treasury API issues
rule_files:
  - 'alerts/*.yml'
